services:
  - type: web
    name: ai-portrait-booth
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.4
